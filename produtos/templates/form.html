{% extends 'base.html' %}

{% block title %}
    {{ 'Editar' if produto else 'Novo' }} Produto — MiniStore
{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ 'Editar' if produto else 'Novo' }} Produto</h1>
</div>

{% if produto %}
<form action="{{ url_for('produtos.editar', id=produto.id) }}" method="POST">
{% else %}
<form action="{{ url_for('produtos.nova') }}" method="POST">
{% endif %}

    <div class="form-group">
        <label for="codigo">Código *</label>
        <input type="text" id="codigo" name="codigo" class="form-control" value="{{ produto.codigo if produto else '' }}" required>
    </div>

    <div class="form-group">
        <label for="nome">Nome *</label>
        <input type="text" id="nome" name="nome" class="form-control" value="{{ produto.nome if produto else '' }}" required>
    </div>

    <div class="form-group">
        <label for="id_categoria">Categoria</label>
        <select id="id_categoria" name="id_categoria" class="form-control">
            <option value="">-- Selecione uma Categoria --</option>
            {% for categoria in categorias %}
                <option value="{{ categoria.id }}" {% if produto and produto.id_categoria == categoria.id %}selected{% endif %}>
                    {{ categoria.nome }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="preco">Preço (R$) *</label>
        <input type="number" step="0.01" id="preco" name="preco" class="form-control" value="{{ produto.preco if produto else '' }}" required>
    </div>

    <div class="form-group">
        <label for="descricao">Descrição</label>
        <textarea id="descricao" name="descricao" class="form-control">{{ produto.descricao if produto else '' }}</textarea>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">
            {{ 'Salvar' if produto else 'Cadastrar' }}
        </button>
        <a href="{{ url_for('produtos.listar') }}" class="btn btn-secondary">
            Cancelar
        </a>
    </div>
</form>
{% endblock %}
